name: Deploy production
on:
  workflow_run:
    workflows: ["Application checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uzmedatlas-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.UZMED_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.UZMED_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.UZMED_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ secrets.UZMED_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "rakhimovd@$DEPLOY_HOST" "deploy $SHA"
