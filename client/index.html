<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDGUIDE UZ</title>
    <meta name="application-name" content="MEDGUIDE UZ" />
    <meta name="theme-color" content="#f4f8f8" />
    <meta property="og:site_name" content="MEDGUIDE UZ" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg?v=2" />
    <link rel="preload" as="image" type="image/webp" media="(orientation: landscape)" fetchpriority="high"
      imagesrcset="/images/hero/hero-desktop-1000.webp 1000w, /images/hero/hero-desktop.webp 1672w, /images/hero/hero-desktop-2400.webp 2400w"
      imagesizes="(max-aspect-ratio: 1672/941) 178svh, 100vw" />
    <link rel="preload" as="image" type="image/webp" media="(orientation: portrait)" fetchpriority="high"
      imagesrcset="/images/hero/hero-mobile-1100.webp 1100w, /images/hero/hero-mobile.webp 1762w" imagesizes="66svh" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shown until the app mounts (React replaces the contents of #root). */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f8f8; }
      .boot-mark { position: relative; display: grid; place-items: center; width: 72px; height: 72px; }
      .boot-mark img { width: 40px; height: 40px; }
      .boot-mark::before { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 3px solid #e0eff2; border-top-color: #0187c5; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark::before { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span class="boot-mark"><img src="/brand/logo.svg?v=2" alt="" width="40" height="40" /></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
